<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .pulse-grid {
        stroke: #334155;
        stroke-width: 1;
        opacity: 0.3;
      }
      .anim-wave {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 3;
        stroke-dasharray: 8 8;
        animation: moveWave 20s linear infinite;
        opacity: 0.6;
      }
      .anim-node {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .bar-anim-1 { animation: growBar 4s ease-in-out infinite alternate; }
      .bar-anim-2 { animation: growBar 5s ease-in-out infinite alternate 1s; }
      .bar-anim-3 { animation: growBar 3.5s ease-in-out infinite alternate 0.5s; }

      @keyframes moveWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; }
      }
      @keyframes pulseNode {
        0% { r: 6px; opacity: 0.5; }
        100% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #c084fc); }
      }
      @keyframes growBar {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid & Dynamic Background Graphic Elements (behind text) -->
  <g class="pulse-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Background Decorative Chart Bars (Right-aligned, low opacity to keep title foreground clear) -->
  <g transform="translate(850, 220) scale(1, -1)">
    <rect class="bar-anim-1" x="0" y="0" width="30" height="120" fill="url(#barGrad)" rx="4"/>
    <rect class="bar-anim-2" x="45" y="0" width="30" height="170" fill="url(#barGrad)" rx="4"/>
    <rect class="bar-anim-3" x="90" y="0" width="30" height="140" fill="url(#barGrad)" rx="4"/>
    <rect class="bar-anim-1" x="135" y="0" width="30" height="190" fill="url(#barGrad)" rx="4"/>
  </g>

  <!-- Dynamic Analytics Wave Path -->
  <path class="anim-wave" d="M 50 220 Q 250 80, 450 180 T 850 120 T 1150 200"/>

  <!-- Dynamic Glowing Nodes -->
  <circle cx="250" cy="130" class="anim-node" fill="#38bdf8"/>
  <circle cx="450" cy="180" class="anim-node" fill="#818cf8"/>
  <circle cx="650" cy="140" class="anim-node" fill="#c084fc"/>
  <circle cx="850" cy="120" class="anim-node" fill="#f43f5e"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 130)">
    <!-- Badge Pill -->
    <rect x="0" y="-85" width="280" height="32" fill="#1e293b" rx="16" stroke="#475569" stroke-width="1"/>
    <text x="14" y="-64" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🚀 CURATED ANALYTICS LIST</text>

    <!-- Main Title -->
    <text x="0" y="0" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      User Adoption Analytics
    </text>

    <!-- Subtitle -->
    <text x="0" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Feature Adoption • Onboarding Funnels • Product Analytics • Session Replay
    </text>
  </g>
</svg>
